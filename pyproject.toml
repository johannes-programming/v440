[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
name = "v440"
version = "2.0.57"
description = "This project provides mutable version objects in accordance with PEP440."
readme = "README.rst"
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
authors = [
    { name = "Johannes", email = "johannes.programming@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "cmp3<2,>=1.1",
    "copyable<2,>=1.1",
    "datahold<4,>=3.0",
    "datarepr<2,>=1.2",
    "iterflat<2,>=1.1",
    "iterprod<2,>=1.1",
    "packaging<27,>=26.3",
]
urls.Download = "https://pypi.org/project/v440/#files"
urls.Index = "https://pypi.org/project/v440/"
urls.Source = "https://github.com/johannes-programming/v440/"
urls.Website = "https://v440.johannes-programming.online/"

[tool.ruff]
line-length = 79
lint.select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "F",
    "I",
    "PLE0604",
    "PLE0605",
    "RUF022",
    "RUF068",
    "UP035",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.15"

[tool.mypy]
files = [
    ".",
]
python_version = "3.11"
strict = true
